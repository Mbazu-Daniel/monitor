name: mivacampus
services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mivacampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mivacampus}
      POSTGRES_DB: ${POSTGRES_DB:-mivacampus}
    ports: ["54443:5432"]
    volumes: ["mivacampus_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mivacampus} -d ${POSTGRES_DB:-mivacampus}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mivacampus_pgdata:
